<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly Creative Agency</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        :root {
            --primary-color: #ff4a57;
            --primary-dark: #1f1f25;
            --text-dark: #334155;
            --text-muted: #64748b;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: var(--text-dark);
            height: 100vh;
            margin: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        /* Background Effects */
        .bg-shapes {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }
        .shape-1 {
            position: absolute;
            top: -10%; left: -5%;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255, 74, 87, 0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .shape-2 {
            position: absolute;
            bottom: -15%; right: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(31, 31, 37, 0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        
        /* 404 Container */
        .error-container {
            text-align: center;
            z-index: 10;
            padding: 40px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
            animation: floatup 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        @keyframes floatup {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Logo Mask */
        .brand-logo {
            width: 180px;
            height: 50px;
            background-color: var(--primary-color);
            -webkit-mask: url('assets/images/logoStackly.webp') no-repeat center center;
            mask: url('assets/images/logoStackly.webp') no-repeat center center;
            -webkit-mask-size: contain;
            mask-size: contain;
            margin: 0 auto 30px;
            display: block;
        }

        /* Glitch / Stylized Text */
        .error-code {
            font-size: 150px;
            font-weight: 900;
            line-height: 1;
            margin: 0;
            background: linear-gradient(135deg, var(--primary-color) 0%, #ff8359 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 10px 30px rgba(255, 74, 87, 0.3);
            letter-spacing: -5px;
        }
        
        @media (max-width: 768px) {
            .error-code { font-size: 100px; }
            .brand-logo { width: 140px; height: 40px; margin-bottom: 20px;}
            .error-container { padding: 30px 20px; }
        }

        .error-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--primary-dark);
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .error-desc {
            font-size: 16px;
            color: var(--text-muted);
            margin-bottom: 30px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* Buttons */
        .btn-theme {
            background: linear-gradient(135deg, #ff4a57 0%, #ff8359 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px rgba(255, 74, 87, 0.25);
            transition: all 0.3s ease;
        }
        .btn-theme:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255, 74, 87, 0.35);
            color: white;
        }
        .btn-outline-theme {
            background: transparent;
            color: var(--primary-dark);
            border: 2px solid rgba(31, 31, 37, 0.1);
            padding: 10px 30px;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .btn-outline-theme:hover {
            border-color: var(--primary-dark);
            background: var(--primary-dark);
            color: white;
        }
        
        .btn-group-custom {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div class="bg-shapes">
        <div class="shape-1"></div>
        <div class="shape-2"></div>
    </div>

    <div class="error-container">
        <a href="index.html" class="brand-logo" aria-label="Stackly Logo"></a>
        
        <h1 class="error-code">404</h1>
        <h3 class="error-title">Oops! Page Not Found</h3>
        <p class="error-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        
        <div class="btn-group-custom">
            <a href="index.html" class="btn btn-theme d-flex align-items-center">
                <span class="material-symbols-outlined me-2">home</span> Go to Home
            </a>
            <button onclick="window.history.back()" class="btn btn-outline-theme d-flex align-items-center">
                <span class="material-symbols-outlined me-2">arrow_back</span> Go Back
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
