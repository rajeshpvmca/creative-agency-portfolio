
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: transparent; color: #334155; padding: 15px 25px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08); }
        .text-theme { color: #ff4a57 !important; }
        .bg-theme { background-color: #ff4a57 !important; color: #fff;}
        .bg-theme-light { background-color: rgba(255, 74, 87, 0.1) !important; color: #ff4a57; }
        .btn-theme { background-color: #ff4a57; color: white; border: none; padding: 10px 24px; border-radius: 12px; font-weight: 600; transition: all 0.3s ease;}
        .btn-theme:hover { background-color: #e03e49; color: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 74, 87, 0.3);}
        .btn-outline-theme { border: 2px solid #ff4a57; color: #ff4a57; padding: 8px 20px; border-radius: 10px; font-weight: 600; background: transparent;}
        .btn-outline-theme:hover { background-color: #ff4a57; color: white; }
        .badge-soft-success { background-color: rgba(40, 167, 69, 0.1); color: #28a745; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
        .badge-soft-warning { background-color: rgba(255, 193, 7, 0.1); color: #e0a800; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
        .badge-soft-danger { background-color: rgba(255, 74, 87, 0.1); color: #ff4a57; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
        .badge-soft-info { background-color: rgba(23, 162, 184, 0.1); color: #17a2b8; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
        
        .icon-box { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: rgba(255, 74, 87, 0.1); color: #ff4a57; }
        .icon-box-success { background: rgba(40, 167, 69, 0.1); color: #28a745; }
        .icon-box-info { background: rgba(23, 162, 184, 0.1); color: #17a2b8; }
        .icon-box-warning { background: rgba(255, 193, 7, 0.1); color: #ffc107; }
        
        .avatar-circle { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        
        /* Table */
        .table-custom th { border-bottom: 2px solid #f1f5f9; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; padding: 1.2rem 1rem; }
        .table-custom td { vertical-align: middle; padding: 1rem; color: #475569; border-bottom: 1px solid #f8fafc;}
        .table-custom tr:last-child td { border-bottom: none; }
        
        /* Form controls */
        .form-control, .form-select { border-radius: 10px; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; color: #334155; }
        .form-control:focus, .form-select:focus { border-color: #ff4a57; box-shadow: 0 0 0 4px rgba(255, 74, 87, 0.1); }
    </style>
</head>
<body>

        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bolder mb-1">Analytics & Reports</h2>
                <p class="text-muted mb-0">Deep dive into agency performance and client metrics.</p>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card p-4">
                    <h6 class="text-muted fw-bold mb-2">Total Page Views</h6>
                    <h2 class="fw-bolder mb-0">1.2M</h2>
                    <div class="progress progress-theme mt-3"><div class="progress-bar" style="width: 85%"></div></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4">
                    <h6 class="text-muted fw-bold mb-2">Conversion Rate</h6>
                    <h2 class="fw-bolder mb-0">4.8%</h2>
                    <div class="progress progress-theme mt-3"><div class="progress-bar bg-success" style="width: 65%"></div></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4">
                    <h6 class="text-muted fw-bold mb-2">Bounce Rate</h6>
                    <h2 class="fw-bolder mb-0">42.3%</h2>
                    <div class="progress progress-theme mt-3"><div class="progress-bar bg-warning" style="width: 42%"></div></div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-4">
                    <h6 class="text-muted fw-bold mb-2">Lead Generation</h6>
                    <h2 class="fw-bolder mb-0">384</h2>
                    <div class="progress progress-theme mt-3"><div class="progress-bar bg-info" style="width: 90%"></div></div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-12">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold mb-0">Traffic Sources</h5>
                        <button class="btn btn-sm btn-outline-secondary">Download CSV</button>
                    </div>
                    <div id="trafficChart"></div>
                </div>
            </div>
        </div>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                var options = {
                    series: [{ name: 'Organic Search', data: [31, 40, 28, 51, 42, 109, 100] }, { name: 'Direct', data: [11, 32, 45, 32, 34, 52, 41] }, { name: 'Referral', data: [15, 11, 32, 18, 9, 24, 11] }],
                    chart: { height: 350, type: 'area', toolbar: { show: false }, fontFamily: 'Inter' },
                    colors: ['#ff4a57', '#17a2b8', '#ffc107'],
                    dataLabels: { enabled: false },
                    stroke: { curve: 'smooth', width: 2 },
                    xaxis: { categories: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] }
                };
                new ApexCharts(document.querySelector("#trafficChart"), options).render();
            });
        </script>
         <!-- Redirect Script for Buttons and Dummy Links -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
            
            document.querySelectorAll('a[href="#"], a[href=""]').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
        });
    </script>
    </body></html>
