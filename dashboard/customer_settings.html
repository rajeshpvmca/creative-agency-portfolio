
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: transparent; color: #334155; padding: 15px 25px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); transition: transform 0.3s ease; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08); }
        .text-theme { color: #ff4a57 !important; }
        .bg-theme { background-color: #ff4a57 !important; color: #fff;}
        .bg-theme-light { background-color: rgba(255, 74, 87, 0.1) !important; color: #ff4a57; }
        .btn-theme { background-color: #ff4a57; color: white; border: none; padding: 10px 24px; border-radius: 12px; font-weight: 600; transition: all 0.3s ease;}
        .btn-theme:hover { background-color: #e03e49; color: white; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 74, 87, 0.3);}
        .btn-theme-outline { border: 2px solid #ff4a57; color: #ff4a57; padding: 8px 20px; border-radius: 10px; font-weight: 600; background: transparent;}
        .btn-theme-outline:hover { background-color: #ff4a57; color: white; }
        .badge-soft-success { background-color: rgba(40, 167, 69, 0.1); color: #28a745; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
        .badge-soft-warning { background-color: rgba(255, 193, 7, 0.1); color: #e0a800; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
        .badge-soft-danger { background-color: rgba(255, 74, 87, 0.1); color: #ff4a57; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
        .badge-soft-info { background-color: rgba(23, 162, 184, 0.1); color: #17a2b8; border-radius: 6px; padding: 6px 12px; font-weight: 700; }
        
        .icon-box { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 14px; background: rgba(255, 74, 87, 0.1); color: #ff4a57; }
        .icon-box-success { background: rgba(40, 167, 69, 0.1); color: #28a745; }
        .icon-box-warning { background: rgba(255, 193, 7, 0.1); color: #ffc107; }
        
        /* Table */
        .table-custom th { border-bottom: 2px solid #f1f5f9; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; padding: 1.2rem 1rem; }
        .table-custom td { vertical-align: middle; padding: 1rem; color: #475569; border-bottom: 1px solid #f8fafc;}
        .table-custom tr:last-child td { border-bottom: none; }
        
        .progress-theme { height: 8px; border-radius: 4px; background-color: #f1f5f9; }
        .progress-theme .progress-bar { background-color: #ff4a57; border-radius: 4px; }
        
        /* Form controls */
        .form-control, .form-select { border-radius: 10px; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; color: #334155; }
        .form-control:focus, .form-select:focus { border-color: #ff4a57; box-shadow: 0 0 0 4px rgba(255, 74, 87, 0.1); }
    </style>
</head>
<body>

        <div class="row mb-4">
            <div class="col-12">
                <h2 class="fw-bolder mb-1">Account Settings</h2>
                <p class="text-muted mb-0">Update your personal details and preferences.</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-8">
                <div class="card p-4 mb-4">
                    <h5 class="fw-bold mb-4">Profile Information</h5>
                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box bg-theme text-white fs-3 me-3" style="width: 80px; height: 80px; border-radius: 50%;">S</div>
                        <div>
                            <button class="btn btn-sm btn-theme-outline mb-1">Upload New Photo</button>
                            <p class="text-muted small mb-0">JPG or PNG no larger than 2MB.</p>
                        </div>
                    </div>
                    
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">First Name</label>
                            <input type="text" class="form-control" value="Sarah">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Last Name</label>
                            <input type="text" class="form-control" value="Connor">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Email Address</label>
                            <input type="email" class="form-control" value="sarah@example.com">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-muted">Phone Number</label>
                            <input type="text" class="form-control" value="+1 (555) 000-1234">
                        </div>
                        <div class="col-12 mt-4">
                            <button class="btn btn-theme-primary">Save Changes</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card p-4 mb-4">
                    <h5 class="fw-bold mb-4">Security</h5>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Current Password</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">New Password</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <button class="btn btn-theme-outline w-100">Update Password</button>
                </div>
                
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">Notifications</h5>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="n1" checked>
                        <label class="form-check-label small fw-bold" for="n1">Email on invoice generation</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="n2" checked>
                        <label class="form-check-label small fw-bold" for="n2">Project milestone alerts</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="n3">
                        <label class="form-check-label small fw-bold" for="n3">Marketing newsletter</label>
                    </div>
                </div>
            </div>
        </div>
        
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
     <!-- Redirect Script for Buttons and Dummy Links -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
            
            document.querySelectorAll('a[href="#"], a[href=""]').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.top.location.href = '../404.html';
                });
            });
        });
    </script>

    </body></html>
